# The server tests/live/registration.ts drives against a real user pool and
# DynamoDB table. It stays out of the crate's build and package.
[package]
name = "cognito-kit-live"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "sso", "behavior-version-latest"] }
aws-sdk-cognitoidentityprovider = { version = "1.144.0", default-features = false }
aws-sdk-dynamodb = { version = "1.136.0", default-features = false }
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-ring"] }
axum = { version = "0.8.7", default-features = false, features = ["tokio", "http1", "json"] }
cognito-kit = { path = "../../..", features = ["axum", "dynamodb"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }
url = "2.5.7"

[workspace]
