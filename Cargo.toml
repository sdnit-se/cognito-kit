[package]
name = "cognito-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust toolkit for Amazon Cognito"
license = "MIT"
authors = ["Jonatan Jonasson"]
repository = "https://github.com/sdnit-se/cognito-kit"
documentation = "https://docs.rs/cognito-kit"
readme = "README.md"
keywords = ["cognito", "jwt", "oauth", "oidc", "mcp"]
categories = ["authentication", "web-programming"]
include = ["/src", "/examples", "/tests/*.rs", "/tests/support", "/README.md", "/CHANGELOG.md", "/LICENSE", "/SECURITY.md"]

[features]
default = ["reqwest"]
# The default HTTP client for fetching keys and calling Cognito's token endpoint:
# reqwest over rustls with ring, trusting the system's root certificates.
reqwest = ["dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier"]
# An extractor for verified access-token claims and the MCP front's routes.
axum = ["dep:axum"]
# A layer that admits only requests with a valid access token.
tower = ["dep:tower-layer", "dep:tower-service"]

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
http = "1.3.1"
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
subtle = { version = "2.6.1", default-features = false }
thiserror = "2.0.17"
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
url = "2.5.7"

axum = { version = "0.8.7", optional = true, default-features = false }
reqwest = { version = "0.13.1", optional = true, default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring"] }
rustls-platform-verifier = { version = "0.7.1", optional = true }
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }

[dev-dependencies]
axum = { version = "0.8.7", default-features = false, features = ["tokio", "http1", "json"] }
getrandom = "0.3.4"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rand = "0.8.5"
rsa = "0.9.8"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5.2", features = ["util"] }

# Test keys are generated at run time; unoptimised bignum code makes that slow.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "portal"
required-features = ["axum", "reqwest"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
